<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Segoe UI, Arial, sans-serif">
  <title>Semaphore: how the pieces connect</title>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="880" height="470" rx="16" fill="#f8fafc"/>
  <text x="440" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Semaphore: how the pieces connect</text>
  <text x="440" y="56" text-anchor="middle" font-size="12" fill="#475569">Solid lines are needed for the sample and CSV work. Dashed boxes are optional.</text>

  <!-- Browser -->
  <rect x="30" y="76" width="230" height="230" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="145" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">Browser page</text>
  <text x="145" y="132" text-anchor="middle" font-size="12" fill="#3730a3">React UI (web/src)</text>
  <text x="145" y="152" text-anchor="middle" font-size="12" fill="#3730a3">Planner, engine, CSV</text>
  <text x="145" y="172" text-anchor="middle" font-size="12" fill="#3730a3">(src/core, in the page)</text>
  <text x="145" y="202" text-anchor="middle" font-size="12" fill="#4338ca">Sample data and CSV</text>
  <text x="145" y="222" text-anchor="middle" font-size="12" fill="#4338ca">stay in the browser</text>
  <text x="145" y="248" text-anchor="middle" font-size="11" fill="#4338ca">web/dist, built with npm run build</text>

  <!-- Server -->
  <rect x="325" y="76" width="230" height="230" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="440" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">Semaphore server</text>
  <text x="440" y="132" text-anchor="middle" font-size="12" fill="#047857">PowerShell 5.1, 127.0.0.1</text>
  <text x="440" y="152" text-anchor="middle" font-size="12" fill="#047857">Ports 8800-8802</text>
  <text x="440" y="176" text-anchor="middle" font-size="12" fill="#065f46">Routes.ps1, Query.ps1</text>
  <text x="440" y="196" text-anchor="middle" font-size="12" fill="#065f46">Connectors.ps1, Lake.ps1</text>
  <text x="440" y="220" text-anchor="middle" font-size="12" fill="#065f46">Local folder: Semaphore home</text>
  <text x="440" y="240" text-anchor="middle" font-size="11" fill="#065f46">hoists, catalogs, playbook</text>
  <text x="440" y="290" text-anchor="middle" font-size="11" fill="#047857">Loopback only, token checked</text>

  <!-- Data sources -->
  <rect x="620" y="76" width="230" height="230" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="735" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3412">Data sources</text>
  <text x="735" y="132" text-anchor="middle" font-size="12" fill="#c2410c">ODBC and OLE DB</text>
  <text x="735" y="152" text-anchor="middle" font-size="11" fill="#9a3412">Postgres, Oracle, Access,</text>
  <text x="735" y="168" text-anchor="middle" font-size="11" fill="#9a3412">SQL Server (Query.ps1)</text>
  <text x="735" y="196" text-anchor="middle" font-size="12" fill="#c2410c">AWS over HTTPS</text>
  <text x="735" y="216" text-anchor="middle" font-size="11" fill="#9a3412">Athena (Lake.ps1), Redshift</text>
  <text x="735" y="240" text-anchor="middle" font-size="12" fill="#c2410c">Azure Synapse, Palantir Foundry</text>
  <text x="735" y="260" text-anchor="middle" font-size="11" fill="#9a3412">(Connectors.ps1)</text>

  <!-- Flows -->
  <line x1="260" y1="170" x2="323" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="291" y="162" text-anchor="middle" font-size="10" fill="#475569">/api</text>
  <line x1="555" y1="170" x2="618" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="586" y="162" text-anchor="middle" font-size="10" fill="#475569">SQL</text>

  <!-- Optional row -->
  <rect x="30" y="346" width="230" height="92" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="145" y="372" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Fleet exports (files)</text>
  <text x="145" y="394" text-anchor="middle" font-size="11" fill="#475569">Halyard, PacketRat, Eight Bells</text>
  <text x="145" y="412" text-anchor="middle" font-size="11" fill="#475569">Imported in the page, not live</text>

  <rect x="325" y="346" width="230" height="92" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="440" y="372" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Fairlead on 8776</text>
  <text x="440" y="394" text-anchor="middle" font-size="11" fill="#475569">Optional AI drafts only</text>
  <text x="440" y="412" text-anchor="middle" font-size="11" fill="#475569">Local rules run without it</text>

  <rect x="620" y="346" width="230" height="92" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="735" y="372" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Lazarette vault</text>
  <text x="735" y="394" text-anchor="middle" font-size="11" fill="#475569">Optional, found by LAZARETTE_PATH</text>
  <text x="735" y="412" text-anchor="middle" font-size="11" fill="#475569">Items named in sources.json</text>

  <line x1="145" y1="346" x2="145" y2="308" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <line x1="440" y1="308" x2="440" y2="344" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <line x1="600" y1="306" x2="700" y2="344" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="440" y="458" text-anchor="middle" font-size="11" fill="#64748b">Every line is read from the code: server/Start-Semaphore.ps1, server/Vault.ps1, server/Intelligence.ps1, src/core/fleet-exports.ts</text>
</svg>

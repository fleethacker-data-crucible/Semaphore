<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="Segoe UI, Arial, sans-serif">
  <title>Semaphore test flow, eight stages</title>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="880" height="320" rx="16" fill="#f8fafc"/>
  <text x="440" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">The test flow, in order</text>
  <text x="440" y="56" text-anchor="middle" font-size="12" fill="#475569">Do not skip a stage: a failed smoke test makes the functional results meaningless.</text>

  <!-- Row 1, left to right -->
  <rect x="40" y="84" width="170" height="78" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="125" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">1  Prerequisites</text>
  <text x="125" y="134" text-anchor="middle" font-size="11" fill="#3730a3">Section 1</text>

  <rect x="250" y="84" width="170" height="78" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="335" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">2  Build</text>
  <text x="335" y="134" text-anchor="middle" font-size="11" fill="#3730a3">Section 2: npm ci, test, build</text>

  <rect x="460" y="84" width="170" height="78" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="545" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">3  Start</text>
  <text x="545" y="134" text-anchor="middle" font-size="11" fill="#3730a3">Section 3: Launch-Semaphore.bat</text>

  <rect x="670" y="84" width="170" height="78" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="755" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">4  Smoke tests</text>
  <text x="755" y="134" text-anchor="middle" font-size="11" fill="#047857">Section 4: one per dependency</text>

  <line x1="210" y1="123" x2="248" y2="123" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="420" y1="123" x2="458" y2="123" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="630" y1="123" x2="668" y2="123" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Drop to row 2 -->
  <path d="M755,162 L755,196" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Row 2, right to left -->
  <rect x="670" y="198" width="170" height="78" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="755" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">5  Functional tests</text>
  <text x="755" y="248" text-anchor="middle" font-size="11" fill="#047857">Section 5: F1 to F27</text>

  <rect x="460" y="198" width="170" height="78" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="545" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">6  Failure checks</text>
  <text x="545" y="248" text-anchor="middle" font-size="11" fill="#c2410c">Section 6: symptom to fix</text>

  <rect x="250" y="198" width="170" height="78" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="335" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">7  Checklist</text>
  <text x="335" y="248" text-anchor="middle" font-size="11" fill="#3730a3">Section 7: copy into the record</text>

  <rect x="40" y="198" width="170" height="78" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="125" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">8  Report</text>
  <text x="125" y="248" text-anchor="middle" font-size="11" fill="#3730a3">Section 8: what to send back</text>

  <line x1="668" y1="237" x2="632" y2="237" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="458" y1="237" x2="422" y2="237" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="248" y1="237" x2="212" y2="237" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="440" y="300" text-anchor="middle" font-size="11" fill="#64748b">Green boxes are the stages that touch live dependencies. Status words are defined in 03-status-legend.svg.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="Segoe UI, Arial, sans-serif">
  <title>Status legend for Semaphore test results</title>
  <rect width="880" height="430" rx="16" fill="#f8fafc"/>
  <text x="440" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Status legend</text>
  <text x="440" y="56" text-anchor="middle" font-size="12" fill="#475569">Write exactly one of these words against each step. Never leave a step blank.</text>

  <!-- PASS -->
  <rect x="40" y="82" width="800" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="56" y="92" width="112" height="28" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="112" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">PASS</text>
  <text x="200" y="112" font-size="13" fill="#1e293b">The result matches the Expected line exactly, and nothing extra appeared on screen.</text>

  <!-- FAIL -->
  <rect x="40" y="140" width="800" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="56" y="150" width="112" height="28" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="112" y="169" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">FAIL</text>
  <text x="200" y="170" font-size="13" fill="#1e293b">The result differs from Expected. Copy the exact text and go to Section 6, then Section 8.</text>

  <!-- BLOCKED -->
  <rect x="40" y="198" width="800" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="56" y="208" width="112" height="28" rx="14" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="112" y="227" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">BLOCKED</text>
  <text x="200" y="228" font-size="13" fill="#1e293b">A step before this one failed, so it cannot be run. Name the step that blocked it.</text>

  <!-- NOT CONFIGURED -->
  <rect x="40" y="256" width="800" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="56" y="266" width="112" height="28" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="112" y="285" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">NOT SET UP</text>
  <text x="200" y="286" font-size="13" fill="#1e293b">An optional dependency (Lazarette, Fairlead, AWS, Foundry) is not installed here. Skip it and say so.</text>

  <!-- UNVERIFIED -->
  <rect x="40" y="314" width="800" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="56" y="324" width="112" height="28" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="112" y="343" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">UNVERIFIED</text>
  <text x="200" y="344" font-size="13" fill="#1e293b">The procedure says so: the repo does not show this step. Run it, record what happened, and do not assume a result.</text>

  <!-- NOT YET BUILT -->
  <rect x="40" y="372" width="800" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="56" y="382" width="112" height="28" rx="14" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="112" y="401" text-anchor="middle" font-size="11" font-weight="700" fill="#312e81">NOT YET BUILT</text>
  <text x="200" y="402" font-size="13" fill="#1e293b">The repo's own docs list it as still to do. Not tested. Record it, with the doc that says so.</text>
</svg>

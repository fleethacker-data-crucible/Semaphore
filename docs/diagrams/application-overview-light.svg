<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title description"><title id="title">How the application fits together</title><desc id="description">Analysts use a browser with the shared TypeScript core. Sample and CSV calculations remain in the browser. The local PowerShell server executes database and Athena queries, persists JSON documents and proxies optional model requests to Fairlead. Leadership reads snapshots through its own local server.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#1f5f7b"/></marker></defs>
<style>text{font-family:"Segoe UI",Arial,sans-serif} .mono{font-family:Consolas,monospace}</style>
<rect x="0" y="0" width="1280" height="760" rx="0" fill="#fbfaf2" stroke="#fbfaf2" stroke-width="1.5"/>
<text x="40" y="44" font-size="14" fill="#755735" font-weight="700" text-anchor="start" class="">SEMAPHORE / ARCHITECTURE</text>
<text x="40" y="88" font-size="32" fill="#132633" font-weight="700" text-anchor="start" class="">How the application fits together</text>
<text x="40" y="119" font-size="17" fill="#425c6c" font-weight="400" text-anchor="start" class="">Application preview: browser calculations, a local Windows API, explicit service connections and shared documents.</text>
<text x="1240" y="44" font-size="13" fill="#755735" font-weight="700" text-anchor="end" class="">PREVIEW / PRs #10 + #13</text>
<g data-card="Analyst browser">
<rect x="40" y="170" width="360" height="182" rx="14" fill="#ffffff" stroke="#8c8370" stroke-width="1.5"/>
<text x="60" y="201" font-size="12" fill="#755735" font-weight="700" text-anchor="start" class="">PR #10 BASE + #13 EXTENSIONS</text>
<text x="60" y="231" font-size="21" fill="#132633" font-weight="700" text-anchor="start" class="">Analyst browser</text>
<text x="60" y="263" font-size="16" fill="#425c6c" font-weight="400" text-anchor="start" class="">React UI + shared TypeScript core</text>
<text x="60" y="286" font-size="16" fill="#425c6c" font-weight="400" text-anchor="start" class="">Sample / CSV engine in the browser</text>
<text x="60" y="309" font-size="16" fill="#425c6c" font-weight="400" text-anchor="start" class="">Draft, inspect SQL, accept and filter</text>
</g>
<g data-card="Local Windows API">
<rect x="460" y="170" width="360" height="182" rx="14" fill="#ffffff" stroke="#8c8370" stroke-width="1.5"/>
<text x="480" y="201" font-size="12" fill="#755735" font-weight="700" text-anchor="start" class="">SERVER</text>
<text x="480" y="231" font-size="21" fill="#132633" font-weight="700" text-anchor="start" class="">Local Windows API</text>
<text x="480" y="263" font-size="16" fill="#425c6c" font-weight="400" text-anchor="start" class="">PowerShell 5.1 / loopback only</text>
<text x="480" y="286" font-size="16" fill="#425c6c" font-weight="400" text-anchor="start" class="">Session token + Host / Origin checks</text>
<text x="480" y="309" font-size="16" fill="#425c6c" font-weight="400" text-anchor="start" class="">Query, profile and document routes</text>
</g>
<g data-card="Configured data services">
<rect x="880" y="170" width="360" height="182" rx="14" fill="#ffffff" stroke="#8c8370" stroke-width="1.5"/>
<text x="900" y="201" font-size="12" fill="#755735" font-weight="700" text-anchor="start" class="">NETWORK WHEN CONFIGURED</text>
<text x="900" y="231" font-size="21" fill="#132633" font-weight="700" text-anchor="start" class="">Configured data services</text>
<text x="900" y="263" font-size="16" fill="#425c6c" font-weight="400" text-anchor="start" class="">ODBC / OLE DB databases (#10)</text>
<text x="900" y="286" font-size="16" fill="#425c6c" font-weight="400" text-anchor="start" class="">Athena, Glue and S3 (#13)</text>
<text x="900" y="309" font-size="16" fill="#425c6c" font-weight="400" text-anchor="start" class="">Database drivers / access required</text>
</g>
<polyline points="400,230 460,230" fill="none" stroke="#1f5f7b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="430" y="218" font-size="13" fill="#1f5f7b" font-weight="600" text-anchor="middle" class="">requests</text>
<polyline points="460,304 400,304" fill="none" stroke="#1f5f7b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="430" y="292" font-size="13" fill="#1f5f7b" font-weight="600" text-anchor="middle" class="">results</text>
<polyline points="820,230 880,230" fill="none" stroke="#1f5f7b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="850" y="218" font-size="13" fill="#1f5f7b" font-weight="600" text-anchor="middle" class="">query</text>
<polyline points="880,304 820,304" fill="none" stroke="#1f5f7b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="850" y="292" font-size="13" fill="#1f5f7b" font-weight="600" text-anchor="middle" class="">rows</text>
<g data-card="Leadership browser">
<rect x="40" y="475" width="360" height="174" rx="14" fill="#ffffff" stroke="#8c8370" stroke-width="1.5"/>
<text x="60" y="506" font-size="12" fill="#755735" font-weight="700" text-anchor="start" class="">ASK VIEW</text>
<text x="60" y="536" font-size="21" fill="#132633" font-weight="700" text-anchor="start" class="">Leadership browser</text>
<text x="60" y="568" font-size="16" fill="#425c6c" font-weight="400" text-anchor="start" class="">Questions reuse accepted definitions</text>
<text x="60" y="591" font-size="16" fill="#425c6c" font-weight="400" text-anchor="start" class="">Answers use summarized snapshots</text>
<text x="60" y="614" font-size="16" fill="#425c6c" font-weight="400" text-anchor="start" class="">No direct database queries</text>
</g>
<g data-card="Shared document store">
<rect x="460" y="475" width="360" height="174" rx="14" fill="#ffffff" stroke="#8c8370" stroke-width="1.5"/>
<text x="480" y="506" font-size="12" fill="#755735" font-weight="700" text-anchor="start" class="">JSON FILES</text>
<text x="480" y="536" font-size="21" fill="#132633" font-weight="700" text-anchor="start" class="">Shared document store</text>
<text x="480" y="568" font-size="16" fill="#425c6c" font-weight="400" text-anchor="start" class="">Hoists, catalogs and playbook</text>
<text x="480" y="591" font-size="16" fill="#425c6c" font-weight="400" text-anchor="start" class="">Snapshots and report editions</text>
<text x="480" y="614" font-size="16" fill="#425c6c" font-weight="400" text-anchor="start" class="">Local folder or Windows share</text>
</g>
<g data-card="Optional model path">
<rect x="880" y="475" width="360" height="174" rx="14" fill="#ffffff" stroke="#8c8370" stroke-width="1.5"/>
<text x="900" y="506" font-size="12" fill="#755735" font-weight="700" text-anchor="start" class="">PR #13</text>
<text x="900" y="536" font-size="21" fill="#132633" font-weight="700" text-anchor="start" class="">Optional model path</text>
<text x="900" y="568" font-size="16" fill="#425c6c" font-weight="400" text-anchor="start" class="">Semaphore proxy to local Fairlead</text>
<text x="900" y="591" font-size="16" fill="#425c6c" font-weight="400" text-anchor="start" class="">Local model route by default</text>
<text x="900" y="614" font-size="16" fill="#425c6c" font-weight="400" text-anchor="start" class="">Remote route requires explicit opt-in</text>
</g>
<polyline points="700,352 700,475" fill="none" stroke="#1f5f7b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="700" y="414" font-size="13" fill="#1f5f7b" font-weight="600" text-anchor="middle" class="">read / write documents</text>
<polyline points="400,556 427,556 427,406 568,406 568,352" fill="none" stroke="#1f5f7b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="509" y="395" font-size="13" fill="#1f5f7b" font-weight="600" text-anchor="middle" class="">local document APIs</text>
<polyline points="820,332 849,332 849,550 880,550" fill="none" stroke="#1f5f7b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="929" y="422" font-size="13" fill="#1f5f7b" font-weight="600" text-anchor="middle" class="">model request</text>
<rect x="40" y="685" width="1200" height="51" rx="10" fill="#f3efe2" stroke="#8c8370" stroke-width="1.5"/>
<text x="58" y="707" font-size="14" fill="#425c6c" font-weight="400" text-anchor="start" class="">Each user runs a local browser and server. Windows folder permissions govern access to shared documents.</text>
<text x="58" y="725" font-size="14" fill="#425c6c" font-weight="400" text-anchor="start" class="">Database calls do not pass through Fairlead today. This application is not yet part of the main-branch core.</text>
</svg>
